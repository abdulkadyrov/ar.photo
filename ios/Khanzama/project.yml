name: Khanzama
options:
  bundleIdPrefix: ru.khanzama
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    KHANZAMA_BUNDLE_ID: ru.khanzama.arphoto
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SUPPORTS_MACCATALYST: NO
targets:
  Khanzama:
    type: application
    platform: iOS
    sources: [Shared, App, Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KHANZAMA_BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Khanzama.entitlements
    dependencies:
      - target: KhanzamaClip
        embed: true
  KhanzamaClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources: [Shared, Clip, Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KHANZAMA_BUNDLE_ID).Clip
        INFOPLIST_FILE: Clip/Info.plist
        CODE_SIGN_ENTITLEMENTS: Clip/KhanzamaClip.entitlements
    dependencies:
      - sdk: AppClip.framework
schemes:
  Khanzama:
    build:
      targets:
        Khanzama: all
  KhanzamaClip:
    build:
      targets:
        KhanzamaClip: all
