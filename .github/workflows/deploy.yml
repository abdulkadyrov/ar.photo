name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libpixman-1-dev libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PUBLIC_APP_URL: https://abdulkadyrov.github.io/ar.photo/
        run: npm run build
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html
      - name: Attach release manifest
        run: npm run release:manifest && cp artifacts/release-manifest.json dist/release-manifest.json
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll
      - name: Checkout Pages branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 6
      - name: Preserve previous immutable assets
        run: |
          for revision in $(git -C pages rev-list --max-count=6 HEAD); do
            git -C pages archive "$revision" assets | tar --extract --skip-old-files --directory=dist
          done
      - name: Publish Pages branch
        run: |
          rsync -a --delete --exclude=.git dist/ pages/
          git -C pages config user.name "github-actions[bot]"
          git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C pages add --all
          if git -C pages diff --cached --quiet; then
            echo "Published assets are already current."
          else
            git -C pages commit -m "deploy: ${GITHUB_SHA}"
            git -C pages push origin gh-pages
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          timeout: 1800000
