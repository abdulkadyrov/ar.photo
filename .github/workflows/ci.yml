name: Quality

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Bundle budget
        run: npm run check:bundle
      - name: Secret scan
        run: npm run check:secrets
      - name: Public metadata scan
        run: npm run check:metadata
      - name: Production dependency audit
        run: npm run check:dependencies
      - name: Security headers and PWA cache contract
        run: npm run check:security
      - name: Generate CycloneDX SBOM
        run: npm run --silent sbom > sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Browser smoke test
        run: npm run test:e2e

  database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.1
      - name: Start clean database
        run: supabase db start
      - name: Reset and seed schema
        run: supabase db reset
      - name: Lint database functions
        run: supabase db lint --local --schema public,private --level error --fail-on error
      - name: Run pgTAP policy tests
        run: supabase test db --local supabase/tests
      - name: Generate database types
        run: |
          mkdir -p artifacts
          supabase gen types typescript --local --schema public > artifacts/database.types.ts
      - name: Upload generated database types
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: database-types
          path: artifacts/database.types.ts
          if-no-files-found: error
      - name: Stop database
        if: always()
        run: supabase stop --no-backup
