name: Processing worker

on:
  workflow_dispatch:
  schedule:
    # Test-stage queue runner: start often, drain the current queue, then exit.
    # This avoids relying on one long-lived hosted runner and gives a delayed
    # GitHub schedule another chance five minutes later.
    - cron: "*/5 * * * *"
  pull_request:
    paths:
      - ".github/workflows/worker.yml"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.worker.json"
      - "workers/**"
      - "src/features/ar-items/markerQuality.ts"
      - "src/shared/api/database.types.ts"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/worker.yml"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.worker.json"
      - "workers/**"
      - "src/features/ar-items/markerQuality.ts"
      - "src/shared/api/database.types.ts"

permissions:
  contents: read

concurrency:
  group: processing-worker-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build worker image
        run: docker build --file workers/processing/Dockerfile --tag ar-photo-processing-worker:test .
      - name: Verify worker runtime
        run: >-
          docker run --rm --entrypoint sh ar-photo-processing-worker:test -c
          'node --check dist-worker/workers/processing/index.js &&
          ffmpeg -version >/dev/null && ffprobe -version >/dev/null && cwebp -version >/dev/null'
      - name: Drain production processing queue
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.PROCESSING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROCESSING_SUPABASE_SERVICE_ROLE_KEY }}
          PROCESSING_WORKER_ID: github-actions-${{ github.run_id }}-${{ github.run_attempt }}
          PROCESSING_CONCURRENCY: "4"
          PROCESSING_POLL_INTERVAL_MS: "2000"
          PROCESSING_IDLE_POLLS_BEFORE_EXIT: "3"
          PROCESSING_MAX_RUNTIME_MS: "2400000"
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          docker run --rm \
            -e SUPABASE_URL \
            -e SUPABASE_SERVICE_ROLE_KEY \
            -e PROCESSING_WORKER_ID \
            -e PROCESSING_CONCURRENCY \
            -e PROCESSING_POLL_INTERVAL_MS \
            -e PROCESSING_IDLE_POLLS_BEFORE_EXIT \
            -e PROCESSING_MAX_RUNTIME_MS \
            ar-photo-processing-worker:test
